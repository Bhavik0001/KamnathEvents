<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Metallic Gold & Crimson Accent Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8BD" />
      <stop offset="30%" stop-color="#F5A623" />
      <stop offset="70%" stop-color="#E58A10" />
      <stop offset="100%" stop-color="#C4242B" />
    </linearGradient>

    <!-- Crimson & Coral Brand Gradient -->
    <linearGradient id="crimsonBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F84464" />
      <stop offset="60%" stop-color="#E53554" />
      <stop offset="100%" stop-color="#C4242B" />
    </linearGradient>

    <!-- Subtle Secondary Gold Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4242B" />
      <stop offset="40%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#FFF0D0" />
    </linearGradient>

    <!-- Radial Glow for Center (BMS Crimson Ambient) -->
    <radialGradient id="royalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F84464" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#C4242B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#12131A" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for subtle luxury drop shadow -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F84464" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Crest -->
  <circle cx="60" cy="60" r="48" fill="url(#royalGlow)" />

  <!-- Outer Hexagonal / Diamond Shield Frame -->
  <polygon points="60,10 102,34 102,86 60,110 18,86 18,34" 
           stroke="url(#crimsonBrand)" stroke-width="3" fill="#1F2533" filter="url(#goldShadow)" />

  <!-- Inner Concentric Frame -->
  <polygon points="60,17 96,38 96,82 60,103 24,82 24,38" 
           stroke="url(#goldLight)" stroke-width="1.2" stroke-dasharray="3,2" fill="none" opacity="0.85" />

  <!-- Royal Crown on Top of 'K' -->
  <path d="M46,38 L51,46 L60,34 L69,46 L74,38 L72,50 L48,50 Z" 
        fill="url(#goldMetallic)" stroke="url(#goldMetallic)" stroke-width="0.8" />
  <!-- Crown Jewels / Spheres -->
  <circle cx="46" cy="37" r="1.8" fill="#FFF9D2" />
  <circle cx="60" cy="33" r="2.2" fill="#FFF9D2" />
  <circle cx="74" cy="37" r="1.8" fill="#FFF9D2" />

  <!-- Center Monarchic Monogram "K" -->
  <path d="M50,54 L50,86 M50,70 L68,54 M58,64 L72,86" 
        stroke="url(#goldMetallic)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Left Laurel Leaf Wreath Branch -->
  <path d="M30,50 Q26,65 33,80 Q25,72 27,58 Z" fill="url(#crimsonBrand)" opacity="0.85" />
  <path d="M34,42 Q28,52 35,62 Q29,56 32,46 Z" fill="url(#goldLight)" opacity="0.85" />

  <!-- Right Laurel Leaf Wreath Branch -->
  <path d="M90,50 Q94,65 87,80 Q95,72 93,58 Z" fill="url(#crimsonBrand)" opacity="0.85" />
  <path d="M86,42 Q92,52 85,62 Q91,56 88,46 Z" fill="url(#goldLight)" opacity="0.85" />

  <!-- Sparkling 4-point Stars -->
  <path d="M60,100 L61.5,103 L64,104.5 L61.5,106 L60,109 L58.5,106 L56,104.5 L58.5,103 Z" fill="url(#goldLight)" />
  <circle cx="60" cy="23" r="1.5" fill="#FFF" />
</svg>
