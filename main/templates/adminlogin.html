{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Kamnath Events</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- Modular Production CSS -->
  <link rel="stylesheet" href="{% static 'css/design-system.css' %}?v=1.2">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=1.2">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=1.2">

  <style>
    /* Force hide Microsoft Edge native password reveal eye */
    ::-ms-reveal {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
    input::-ms-reveal {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
  </style>

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('ke_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-main); padding: 20px; position: relative;">

  <!-- Floating Theme Toggle for Admin -->
  <div style="position: absolute; top: 20px; right: 20px;">
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
      <span class="theme-toggle-icon-wrap">
        <i class="fa-solid fa-sun icon-theme-sun"></i>
        <i class="fa-solid fa-moon icon-theme-moon"></i>
      </span>
    </button>
  </div>

  <div class="auth-modal-dialog" style="max-width: 400px;">
    
    <div class="text-center mb-4">
      <div class="brand-icon-wrapper mx-auto mb-2" style="width: 44px; height: 44px;">
        <i class="fa-solid fa-lock" style="font-size: 1.15rem;"></i>
      </div>
      <h2 class="fs-4 text-dark mb-1">Organizer Sign In</h2>
      <p class="text-secondary small">Enter credentials to open the management console.</p>
    </div>

    {% if error %}
      <div class="p-2 mb-3 rounded border border-danger d-flex align-items-center gap-2" style="background: #fef2f2; color: #b91c1c; font-size: 0.85rem;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="{% url 'admin_login' %}" method="POST">
      {% csrf_token %}

      <div class="auth-form-group">
        <label class="auth-label">Username</label>
        <div class="auth-input-wrapper">
          <i class="auth-input-icon fa-regular fa-user"></i>
          <input type="text" name="username" class="auth-input" placeholder="Admin username" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="auth-form-group">
        <label class="auth-label">Password</label>
        <div class="auth-input-wrapper has-toggle">
          <i class="auth-input-icon fa-solid fa-lock"></i>
          <input type="password" name="password" class="auth-input" placeholder="Password" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-brand w-100 mt-2">
        Sign In
      </button>

      <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-subtle) !important;">
        <a href="{% url 'home' %}" class="text-secondary small">
          Return to Events Directory
        </a>
      </div>
    </form>

  </div>

  <script src="{% static 'js/main.js' %}?v=2.0" defer></script>
  <script src="{% static 'js/auth.js' %}?v=2.0" defer></script>
</body>
</html>
