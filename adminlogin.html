<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kamnath Events | Admin Login</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        font-family: Arial, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-box {
        width: 420px;
        background: white;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .logo {
        text-align: center;
        font-family: Georgia, serif;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .logo-white {
        color: #0f172a;
      }

      .logo-orange {
        color: #ff5a36;
      }

      .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
      }

      .admin-icon {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #ffeae5;
        color: #ff5a36;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 30px;
        margin: 0 auto 20px;
      }

      .form-label {
        font-weight: 600;
        color: #0f172a;
      }

      .form-control {
        height: 48px;
        border-radius: 9px;
        border: 1px solid #cbd5e1;
      }

      .form-control:focus {
        border-color: #ff5a36;
        box-shadow: 0 0 0 3px rgba(255, 90, 54, 0.15);
      }

      .login-btn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 9px;

        background: #ff5a36;
        color: white;

        font-size: 16px;
        font-weight: 600;
      }

      .login-btn:hover {
        background: #e04826;
        color: white;
      }

      .back-link {
        text-align: center;
        margin-top: 22px;
      }

      .back-link a {
        color: #ff5a36;
        text-decoration: none;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      .password-box {
        position: relative;
        margin-bottom: 30px;
      }

      .password-box .form-control {
        padding-right: 50px;
      }

      /* Hide Microsoft Edge / Internet Explorer native password eye */
      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none;
      }

      /* Hide browser credential autofill icon */
      input[type="password"]::-webkit-credentials-auto-fill-button {
        visibility: hidden;
        pointer-events: none;
        display: none;
      }

      .eye-btn {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);

        border: none;
        background: transparent;

        color: #64748b;
        font-size: 18px;

        cursor: pointer;
        padding: 5px;

        z-index: 10;
      }

      .eye-btn:hover {
        color: #ff5a36;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <div class="admin-icon">
        <i class="fa-solid fa-user-shield"></i>
      </div>

      <div class="logo">
        <span class="logo-white">Kamnath</span>
        <span class="logo-orange">Events</span>
      </div>

      <p class="subtitle">Administrator Login</p>

      {% if error %}
      <div class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter admin username"
            autocomplete="username"
            required
          />
        </div>

        <div class="password-box">
          <input
            type="password"
            name="password"
            id="password"
            class="form-control"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
          />

          <!-- Custom eye button -->
          <button
            type="button"
            class="eye-btn"
            onclick="togglePassword()"
            aria-label="Show or hide password"
          >
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>

        <button type="submit" class="login-btn">
          <i class="fa-solid fa-right-to-bracket me-2"></i>
          Login to Dashboard
        </button>
      </form>

      <div class="back-link">
        <a href="{% url 'index' %}">
          <i class="fa-solid fa-arrow-left me-1"></i>
          Back to Website
        </a>
      </div>
    </div>

    <script>
      function togglePassword() {
        const password = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (password.type === "password") {
          // Show password
          password.type = "text";

          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        } else {
          // Hide password
          password.type = "password";

          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      }
    </script>
  </body>
</html>
